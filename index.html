<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Remind Me There</title>
<meta name="description" content="Reminders that go off when you arrive at or leave a place.">
<meta name="theme-color" content="#F4F4F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Remind Me There">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
<style>
:root {
  --bg: #F4F4F8;
  --surface: #FFFFFF;
  --ink: #1F1B2D;
  --ink-2: #5E5970;
  --ink-3: #8C88A0;
  --line: #E4E2EC;
  --arrive: #6B3BE6;
  --arrive-soft: #EFE9FD;
  --leave: #0A8A7E;
  --leave-soft: #E1F3F0;
  --danger: #C22D46;
  --r-lg: 22px;
  --r-md: 14px;
  --r-sm: 10px;
  --font: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --nav-h: 64px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font);
  font-size: 17px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--arrive); outline-offset: 2px; }
.hidden { display: none !important; }

/* ---------- Layout ---------- */
#main {
  max-width: 640px; margin: 0 auto;
  padding: calc(env(safe-area-inset-top, 0px) + 18px) 18px calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 96px);
}
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.top h1 { font-size: 1.6rem; line-height: 1.1; margin: 0; letter-spacing: -0.01em; }
.top h1 small { display: block; font-size: .9rem; font-weight: 400; color: var(--ink-2); letter-spacing: 0; margin-top: 4px; }

/* Watching status */
.status {
  display: flex; align-items: center; gap: 12px; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; margin-bottom: 18px;
}
.status .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--ink-3); flex: none; position: relative; }
.status.on .dot { background: var(--leave); }
.status.on .dot::after {
  content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2px solid var(--leave);
  animation: beat 2.4s ease-out infinite; opacity: 0;
}
@keyframes beat { 0% { transform: scale(.6); opacity: .8; } 100% { transform: scale(1.6); opacity: 0; } }
.status .txt { flex: 1; min-width: 0; }
.status .txt b { display: block; font-size: .98rem; }
.status .txt span { font-size: .85rem; color: var(--ink-2); }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; border-radius: 999px; padding: 12px 20px; font-weight: 700; font-size: 1rem;
  background: var(--arrive); color: #fff; min-height: 48px;
}
.btn.small { padding: 8px 14px; min-height: 38px; font-size: .92rem; }
.btn.ghost { background: transparent; color: var(--arrive); box-shadow: inset 0 0 0 2px var(--arrive-soft); }
.btn.soft { background: var(--arrive-soft); color: var(--arrive); }
.btn.plain { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.btn.danger { background: transparent; color: var(--danger); box-shadow: inset 0 0 0 1px #f0c9cf; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; }
.linkbtn { background: none; border: 0; padding: 6px 2px; color: var(--arrive); font-weight: 700; }

/* Places list */
.places { display: grid; gap: 10px; }
.place {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: 14px 16px;
}
.place.here { border-color: var(--arrive); box-shadow: 0 0 0 3px var(--arrive-soft); }
.ring {
  --c: var(--arrive);
  width: 52px; height: 52px; border-radius: 50%; flex: none; display: grid; place-items: center;
  font-size: 1.55rem; background: var(--arrive-soft);
  box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 4px color-mix(in srgb, var(--c) 30%, transparent);
}
.place .info { flex: 1; min-width: 0; }
.place .name { font-weight: 700; font-size: 1.08rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
.tag { font-size: .8rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; }
.tag.a { background: var(--arrive-soft); color: var(--arrive); }
.tag.l { background: var(--leave-soft); color: var(--leave); }
.tag.n { background: #F0EFF4; color: var(--ink-2); }
.place .dist { font-size: .88rem; color: var(--ink-2); text-align: right; flex: none; }
.place.here .dist { color: var(--arrive); font-weight: 700; }

.empty { text-align: center; padding: 38px 18px; background: var(--surface); border: 1px dashed #D3D0DE; border-radius: var(--r-lg); }
.empty h2 { font-size: 1.2rem; margin: 10px 0 6px; }
.empty p { color: var(--ink-2); margin: 0 0 18px; }

.fab {
  position: fixed; right: max(18px, calc(50% - 302px)); bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 18px);
  z-index: 20; box-shadow: 0 10px 26px rgb(107 59 230 / .32);
}

/* Bottom nav */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: rgb(255 255 255 / .94);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
nav.tabs .in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--nav-h); }
nav.tabs button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: .78rem; font-weight: 700; color: var(--ink-3); }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button[aria-current="page"] { color: var(--arrive); }

/* Cards (settings/history) */
h2.sec { font-size: 1.05rem; margin: 26px 0 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 6px 16px; }
.row { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .grow b { display: block; font-size: 1rem; }
.row .grow span { display: block; font-size: .86rem; color: var(--ink-2); }
.note { font-size: .92rem; color: var(--ink-2); padding: 14px 0; margin: 0; }
.note + .note { padding-top: 0; }

.hist { display: flex; gap: 12px; padding: 13px 0; border-top: 1px solid var(--line); }
.hist:first-child { border-top: 0; }
.hist .e { font-size: 1.3rem; width: 30px; text-align: center; flex: none; }
.hist .t { font-weight: 700; }
.hist .m { font-size: .84rem; color: var(--ink-2); }

/* Switch */
.switch { position: relative; width: 52px; height: 32px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: #D8D5E2; transition: background .2s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .25); transition: transform .2s; }
.switch input:checked + span { background: var(--arrive); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 3px solid var(--arrive); outline-offset: 2px; }

/* ---------- Sheets ---------- */
.scrim { position: fixed; inset: 0; background: rgb(31 27 45 / .38); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 640px; max-height: calc(100% - env(safe-area-inset-top, 0px) - 24px); overflow: auto;
  background: var(--bg); border-radius: 26px 26px 0 0;
  padding: 10px 18px calc(env(safe-area-inset-bottom, 0px) + 22px);
}
.sheet.anim { animation: up .24s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
.grab { width: 44px; height: 5px; border-radius: 3px; background: #D3D0DE; margin: 0 auto 12px; }
.sheet-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.sheet-head h2 { margin: 0; font-size: 1.35rem; line-height: 1.15; }
.sheet-head p { margin: 2px 0 0; color: var(--ink-2); font-size: .9rem; }
.sheet-head .grow { flex: 1; min-width: 0; }
.iconbtn { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); display: grid; place-items: center; flex: none; }
.iconbtn svg { width: 20px; height: 20px; }

.group { margin: 18px 0 8px; display: flex; align-items: center; justify-content: space-between; }
.group h3 { margin: 0; font-size: 1rem; }
.group h3 i { font-style: normal; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
.rem { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; margin-bottom: 8px; }
.rem .t { font-weight: 700; white-space: pre-wrap; word-break: break-word; }
.rem .m { font-size: .84rem; color: var(--ink-2); margin-top: 3px; }
.rem ul { margin: 6px 0 0; padding-left: 20px; font-size: .92rem; color: var(--ink-2); }
.none { color: var(--ink-3); font-size: .92rem; margin: 0 0 8px; }

/* Forms */
label.f { display: block; font-weight: 700; font-size: .95rem; margin: 16px 0 6px; }
.input, textarea.input {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm);
  padding: 12px 14px; font-size: 1rem; min-height: 48px;
}
textarea.input { resize: vertical; min-height: 84px; }
.input:focus { outline: 2px solid var(--arrive); outline-offset: 0; border-color: transparent; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: #EAE8F0; padding: 4px; border-radius: var(--r-md); }
.seg.two { grid-template-columns: repeat(2, 1fr); }
.seg button { border: 0; background: none; border-radius: 10px; padding: 10px 6px; font-weight: 700; font-size: .92rem; color: var(--ink-2); min-height: 44px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgb(31 27 45 / .12); }
.checks { display: grid; gap: 6px; }
.check { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 6px 6px 6px 12px; }
.check span { flex: 1; word-break: break-word; }
.addrow { display: flex; gap: 8px; }
.addrow .input { flex: 1; }
.actions { display: grid; gap: 10px; margin-top: 22px; }
.hint { font-size: .85rem; color: var(--ink-2); margin: 6px 0 0; }
.card.setup { border: 2px solid var(--arrive); margin-bottom: 14px; }
.card.setup .row { border-top: 0; }
.guide { text-align: center; padding: 8px 4px 4px; }
.guide h2 { margin: 6px 0 10px; font-size: 1.35rem; }
.guide p { color: var(--ink-2); line-height: 1.5; margin: 0 0 18px; }
.guide .stepno { font-weight: 700; color: var(--arrive); margin-bottom: 4px; }
.guide .ring.big { width: 72px; height: 72px; font-size: 2rem; margin: 0 auto 6px; }
.guide .btn + .btn, .guide .btn + .linkbtn { margin-top: 10px; }
.guide .linkbtn { display: block; width: 100%; }
.hint.warn { color: #B45309; font-weight: 600; }
.callrem { display: flex; align-items: center; gap: 8px; }
.callrem .rem { flex: 1; min-width: 0; }

.emojis { display: flex; flex-wrap: wrap; gap: 6px; }
.emojis button { width: 46px; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 1.4rem; display: grid; place-items: center; }
.emojis button[aria-pressed="true"] { border-color: var(--arrive); box-shadow: 0 0 0 2px var(--arrive-soft); background: var(--arrive-soft); }
input[type=range] { width: 100%; accent-color: var(--arrive); height: 32px; }

/* ---------- Place editor (full screen) ---------- */
.editor { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; flex-direction: column; }
.editor .mapwrap { position: relative; flex: 0 0 46%; min-height: 240px; background: #E6E4EE; }
.editor #map { position: absolute; inset: 0; }
.editor .pin { position: absolute; left: 50%; top: 50%; width: 38px; height: 50px; transform: translate(-50%, -100%); z-index: 500; pointer-events: none; filter: drop-shadow(0 4px 6px rgb(0 0 0 / .3)); }
.editor .maptop { position: absolute; left: 12px; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 12px); z-index: 600; display: flex; gap: 8px; }
.editor .maptop .input { box-shadow: 0 4px 14px rgb(31 27 45 / .15); border: 0; }
.editor .locate { position: absolute; right: 12px; bottom: 14px; z-index: 600; box-shadow: 0 4px 14px rgb(31 27 45 / .2); }
.results { position: absolute; left: 12px; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 70px); z-index: 700; background: var(--surface); border-radius: var(--r-md); box-shadow: 0 10px 30px rgb(31 27 45 / .2); overflow: hidden; }
.results button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 12px 14px; border-top: 1px solid var(--line); font-size: .92rem; }
.results button:first-child { border-top: 0; }
.editor .form { flex: 1; overflow: auto; padding: 4px 18px calc(env(safe-area-inset-bottom, 0px) + 22px); max-width: 640px; width: 100%; margin: 0 auto; }
.editor .formhead { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 2px; }
.editor .formhead h2 { margin: 0; font-size: 1.3rem; }
.nomap { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--ink-2); }
.leaflet-control-attribution { font-size: 10px !important; }

/* ---------- Arrival alert ---------- */
.alert { position: fixed; inset: 0; z-index: 80; background: var(--bg); overflow: auto; }
.alert .in { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 26px) 18px calc(env(safe-area-inset-bottom, 0px) + 26px); }
.pulse { position: relative; width: 150px; height: 150px; margin: 6px auto 16px; display: grid; place-items: center; }
.pulse .core { width: 86px; height: 86px; border-radius: 50%; display: grid; place-items: center; font-size: 2.6rem; background: var(--c-soft); position: relative; z-index: 2; box-shadow: inset 0 0 0 3px #fff; }
.pulse i { position: absolute; inset: 32px; border-radius: 50%; border: 3px solid var(--c); opacity: 0; animation: ripple 2.6s ease-out 3; }
.pulse i:nth-child(2) { animation-delay: .5s; }
.pulse i:nth-child(3) { animation-delay: 1s; }
@keyframes ripple { 0% { transform: scale(.7); opacity: .7; } 100% { transform: scale(1.75); opacity: 0; } }
.alert h2 { text-align: center; font-size: 1.6rem; line-height: 1.15; margin: 0; }
.alert .sub { text-align: center; color: var(--ink-2); margin: 6px 0 22px; }
.alert .item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; margin-bottom: 12px; }
.alert .item .t { font-size: 1.15rem; font-weight: 700; white-space: pre-wrap; word-break: break-word; }
.alert .item .checks { margin-top: 12px; }
.alert .item .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.tick { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--r-sm); background: var(--bg); border: 0; text-align: left; width: 100%; font-size: 1rem; }
.tick .box { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--ink-3); flex: none; display: grid; place-items: center; background: #fff; }
.tick[aria-checked="true"] .box { background: var(--c, var(--arrive)); border-color: var(--c, var(--arrive)); }
.tick[aria-checked="true"] .box::after { content: ""; width: 12px; height: 7px; border-left: 3px solid #fff; border-bottom: 3px solid #fff; transform: translateY(-2px) rotate(-45deg); }
.tick[aria-checked="true"] span { color: var(--ink-3); text-decoration: line-through; }

/* ---------- Welcome ---------- */
.welcome { position: fixed; inset: 0; z-index: 90; background: var(--bg); overflow: auto; }
.welcome .in { min-height: 100%; max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top, 0px) + 48px) 24px calc(env(safe-area-inset-bottom, 0px) + 24px); }
.welcome .appicon { width: 84px; height: 84px; border-radius: 22px; box-shadow: 0 12px 30px rgb(107 59 230 / .3); }
.welcome h1 { font-size: 2.15rem; line-height: 1.05; margin: 22px 0 10px; letter-spacing: -0.02em; }
.welcome .lead { font-size: 1.12rem; color: var(--ink-2); margin: 0 0 26px; }
.steps { list-style: none; padding: 0; margin: 0 0 30px; display: grid; gap: 14px; }
.steps li { display: flex; gap: 12px; align-items: flex-start; }
.steps li .ring { width: 38px; height: 38px; font-size: 1.1rem; }
.steps li b { display: block; }
.steps li span { color: var(--ink-2); font-size: .94rem; }
.welcome .btns { display: grid; gap: 10px; margin-top: auto; }
.gbtn { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line), 0 2px 6px rgb(31 27 45 / .06); }
.gbtn svg { width: 20px; height: 20px; }

.ste { display: block; width: 11rem; max-width: 60%; height: auto; margin: 30px auto 6px; }

/* Toast */
#toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 14px); transform: translateX(-50%); z-index: 100; background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 999px; font-size: .94rem; max-width: calc(100% - 36px); text-align: center; box-shadow: 0 8px 22px rgb(0 0 0 / .2); }

.splash { position: fixed; inset: 0; z-index: 95; background: var(--bg); display: grid; place-items: center; }
.splash img { width: 72px; height: 72px; border-radius: 20px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .pulse i { opacity: .35; animation: none; }
  .pulse i:nth-child(2) { transform: scale(1.3); opacity: .2; }
  .pulse i:nth-child(3) { transform: scale(1.6); opacity: .1; }
}
</style>
</head>
<body>
<div class="splash" id="splash"><img src="apple-touch-icon.png" alt=""></div>
<div id="main"></div>
<nav class="tabs" id="tabs" aria-label="Sections">
  <div class="in">
    <button data-tab="places" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      Places
    </button>
    <button data-tab="calls">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
      Calls
    </button>
    <button data-tab="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
      Done

/* ---- Small helpers ---- */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const clean = (o) => JSON.parse(JSON.stringify(o));
const plural = (n, a, b) => `${n} ${n === 1 ? a : b}`;

function dist(a, b, c, d) {
  const R = 6371000, r = Math.PI / 180;
  const x = Math.sin((c - a) * r / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin((d - b) * r / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
const fmtDist = (m) => m < 1000 ? `${Math.round(m / 10) * 10} m` : `${(m / 1000).toFixed(m < 10000 ? 1 : 0)} km`;
function fmtWhen(t) {
  const d = new Date(t), now = new Date();
  const time = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  if (d.toDateString() === now.toDateString()) return `Today, ${time}`;
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return `Yesterday, ${time}`;
  return d.toLocaleDateString([], { day: "numeric", month: "short" }) + `, ${time}`;
}

let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.remove("hidden");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add("hidden"), 3200);
}

  get places() { return load("rmt:places", []); },

  get calls() { return load("rmt:calls", []); },

async function savePlace(p) {

  if (i >= 0) state.places[i] = p; else state.places.push(p);
  // Saved instantly on the phone; Firebase sends it to your account as soon as there's a connection.
  if (state.cloud) fb.setDoc(fb.doc(fb.db, "users", state.user.uid, "places", p.id), clean(p)).catch((e) => { console.error(e); toast("Couldn't save to your account."); });
  else local.places = state.places;

}
async function removePlace(id) {

  delete presence[id]; savePresence();
  if (state.cloud) fb.deleteDoc(fb.doc(fb.db, "users", state.user.uid, "places", id)).catch((e) => console.error(e));
  else local.places = state.places;

}

async function clearHistory() {

    try { const b = fb.writeBatch(fb.db); old.slice(0, 450).forEach((h) => b.delete(fb.doc(fb.db, "users", state.user.uid, "history", h.id))); b.commit().catch((e) => console.error(e)); } catch (e) { console.error(e); }

async function loadFirebase() {
  const [app, auth, fs] = await Promise.all([
    import(FB + "firebase-app.js"), import(FB + "firebase-auth.js"), import(FB + "firebase-firestore.js"),
  ]);
  const a = app.initializeApp(firebaseConfig);
  let db;
  try { db = fs.initializeFirestore(a, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) }); }
  catch { db = fs.getFirestore(a); }
  fb = { ...auth, ...fs, auth: auth.getAuth(a), db };
}

function stopSync() { unsub.forEach((u) => u()); unsub = []; }

function startSync() {
  stopSync();
  const u = state.user.uid;
  unsub.push(fb.onSnapshot(fb.collection(fb.db, "users", u, "places"), (snap) => {
    state.places = snap.docs.map((d) => d.data());
    render(); if (sheet?.type === "place") rerenderSheet(); renderAlert();
  }, (e) => { console.error(e); toast("Couldn't load your places. Check your connection."); }));
  unsub.push(fb.onSnapshot(fb.collection(fb.db, "users", u, "calls"), (snap) => {
    state.calls = snap.docs.map((d) => d.data());
    render(); if (sheet?.type === "call") rerenderSheet();
  }, (e) => console.error(e)));
  unsub.push(fb.onSnapshot(fb.query(fb.collection(fb.db, "users", u, "history"), fb.orderBy("at", "desc"), fb.limit(150)), (snap) => {
    state.history = snap.docs.map((d) => d.data());
    render();
  }, (e) => console.error(e)));
}

async function moveGuestDataToAccount() {
  const places = local.places, history = local.history, calls = local.calls;
  if (!places.length && !history.length && !calls.length) return;
  try {
    const b = fb.writeBatch(fb.db), u = state.user.uid;
    places.forEach((p) => b.set(fb.doc(fb.db, "users", u, "places", p.id), clean(p)));
    calls.forEach((c) => b.set(fb.doc(fb.db, "users", u, "calls", c.id), clean(c)));
    history.slice(0, 200).forEach((h) => b.set(fb.doc(fb.db, "users", u, "history", h.id), clean(h)));
    b.commit().then(() => { local.places = []; local.history = []; local.calls = []; }).catch((e) => console.error(e));
    if (places.length) toast(`Moved ${plural(places.length, "place", "places")} into your account`);
  } catch (e) { console.error(e); }
}

  const provider = new fb.GoogleAuthProvider();

  try { await fb.signInWithPopup(fb.auth, provider); }
  catch (e) {
    if (["auth/popup-blocked", "auth/operation-not-supported-in-this-environment", "auth/cancelled-popup-request"].includes(e.code)) {
      try { await fb.signInWithRedirect(fb.auth, provider); } catch (e2) { console.error(e2); toast("Couldn't open Google sign-in."); }
    } else if (e.code !== "auth/popup-closed-by-user") {

}

/* =========================================================
   Location watching
   ========================================================= */
let watchId = null, pollTimer = null, tickTimer = null, wakeLock = null;

function startTracking(fromUser) {
  if (!("geolocation" in navigator)) { toast("This browser can't share your location."); return; }
  stopTracking(true);
  state.tracking = true; state.prefs.tracking = true; savePrefs();
  const opts = { enableHighAccuracy: true, maximumAge: 5000, timeout: 30000 };
  watchId = navigator.geolocation.watchPosition(onPos, onPosErr, opts);
  pollTimer = setInterval(() => navigator.geolocation.getCurrentPosition(onPos, () => {}, { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 }), 20000);
  tickTimer = setInterval(checkDelays, 15000);
  if (state.prefs.wake) grabWake();
  if (fromUser) unlockAudio();
  render();
}
function stopTracking(quiet) {
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  clearInterval(pollTimer); clearInterval(tickTimer);
  watchId = null;
  if (!quiet) { state.tracking = false; state.prefs.tracking = false; savePrefs(); releaseWake(); render(); }
}
function onPos(p) {
  state.pos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, at: Date.now() };
  evaluate();
  renderStatus();
  if (state.tab === "places") renderPlacesList();
}
function onPosErr(e) {
  if (e.code === 1) {
    stopTracking();
    toast("Location is turned off for this app. Allow it in your browser or phone settings, then tap Start watching.");
  }
}

async function grabWake() {
  try { if ("wakeLock" in navigator && document.visibilityState === "visible") { wakeLock = await navigator.wakeLock.request("screen"); } } catch {}
}
function releaseWake() { try { wakeLock && wakeLock.release(); } catch {} wakeLock = null; }

/* Decide when you've arrived or left.
   Two readings in a row inside the circle count as arriving; two readings clearly outside count as leaving.
   The gap between the two stops GPS jitter at the edge setting off alerts. */
function evaluate() {
  const pos = state.pos; if (!pos) return;
  if (pos.acc > 250) return;
  const now = Date.now();
  const buffer = Math.min(Math.max(pos.acc, 20), 100);
  for (const pl of state.places) {
    const d = dist(pos.lat, pos.lng, pl.lat, pl.lng);
    const pr = presence[pl.id] || (presence[pl.id] = { state: null, in: 0, out: 0, since: 0, counted: false, fired: [] });
    if (d <= pl.radius) { pr.in++; pr.out = 0; }
    else if (d > pl.radius + buffer) { pr.out++; pr.in = 0; }
    if (pr.in >= 2 && pr.state !== "in") { pr.state = "in"; pr.since = now; pr.counted = false; pr.fired = []; }
    if (pr.state === "in" && !pr.counted && now - pr.since >= (pl.delay || 0) * 1000) { pr.counted = true; fire(pl, "arrive", pr); }
    if (pr.out >= 2 && pr.state !== "out") {
      const wasIn = pr.state === "in" && pr.counted;
      pr.state = "out"; pr.counted = false;
      if (wasIn) fire(pl, "leave", pr);
    }
  }
  for (const id of Object.keys(presence)) if (!state.places.some((p) => p.id === id)) delete presence[id];
  savePresence();
}
function checkDelays() {
  const now = Date.now();
  for (const pl of state.places) {
    const pr = presence[pl.id];
    if (pr && pr.state === "in" && !pr.counted && now - pr.since >= (pl.delay || 0) * 1000) { pr.counted = true; fire(pl, "arrive", pr); savePresence(); }
  }
}
const isHere = (id) => presence[id]?.state === "in";

function fire(pl, event, pr) {
  const due = (pl.reminders || []).filter((r) => (r.when === event || r.when === "both") && !pr.fired.includes(r.id + event));
  if (!due.length) return;
  due.forEach((r) => pr.fired.push(r.id + event));
  savePresence();
  state.alerts.push({ placeId: pl.id, event, ids: due.map((r) => r.id) });
  renderAlert();
  ring(event);
  notify(pl, event, due);
}

/* ---- Sound, vibration, notifications ---- */
let audioCtx = null;
function unlockAudio() {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === "suspended") audioCtx.resume(); } catch {}
}
function ring(event) {
  try { navigator.vibrate && navigator.vibrate([180, 90, 180]); } catch {}
  if (!state.prefs.sound || !audioCtx) return;
  const notes = event === "leave" ? [784, 587] : [587, 784, 988];
  notes.forEach((f, i) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime + i * 0.16;
    o.type = "sine"; o.frequency.value = f; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
    o.start(t); o.stop(t + 0.42);
  });
}
async function notify(pl, event, due) {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  if (document.visibilityState === "visible") return;
  const title = event === "arrive" ? `You're at ${pl.name}` : `Leaving ${pl.name}`;
  const body = due.map((r) => r.text).join("\n");
  const opts = { body, tag: pl.id + event, icon: "icon-192.png", badge: "icon-192.png", renotify: true };
  try { const reg = await navigator.serviceWorker?.ready; if (reg) return reg.showNotification(title, opts); } catch {}
  try { new Notification(title, opts); } catch {}
}
async function askNotifications() {
  if (!("Notification" in window)) {
    toast(/iPhone|iPad/.test(navigator.userAgent) ? "On iPhone, add the app to your home screen first, then turn on alerts." : "This browser can't show notifications.");
    return;
  }
  const r = await Notification.requestPermission();
  toast(r === "granted" ? "Notifications are on" : "Notifications are off. You can turn them on in your phone settings.");
  render();
}

function counts(p) {
  const r = p.reminders || [];

function initMap() {
  const box = $("#map");
  if (typeof L === "undefined") {
    box.innerHTML = `<div class="nomap">The map needs an internet connection.<br>You can still use My location to place the pin where you're standing.</div>`;

    return;
  }
  const p = ed.place;
  const start = p.lat != null ? [p.lat, p.lng] : state.pos ? [state.pos.lat, state.pos.lng] : DUBLIN;
  const zoom = p.lat != null || state.pos ? 17 : 12;
  const map = L.map(box, { zoomControl: false, attributionControl: true }).setView(start, zoom);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(map);
  const circle = L.circle(start, { radius: p.radius, color: "#6B3BE6", weight: 2, fillColor: "#6B3BE6", fillOpacity: 0.12 }).addTo(map);
  map.on("move", () => circle.setLatLng(map.getCenter()));

function locateMe(quiet) {

    else if (ed) { ed.place.lat = state.pos.lat; ed.place.lng = state.pos.lng; toast("Pin placed where you are"); }

}
async function searchAddress(q) {

    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&q=${encodeURIComponent(q)}${near}`, { headers: { "Accept-Language": navigator.language || "en" } });

function canPickContacts() { return !!Caller || ("contacts" in navigator && "select" in navigator.contacts); }
// Returns { name, address, phones } or null if cancelled. Throws on errors.
async function readContact(fields) {
  if (Caller) {
    const c = await Caller.pickContact();
    return c.cancelled ? null : { name: c.name || "", address: c.address || null, phones: c.phones || [] };
  }
  const props = navigator.contacts.getProperties ? await navigator.contacts.getProperties() : ["name", "address"];
  const want = ["name", ...fields].filter((p) => props.includes(p));
  const [c] = await navigator.contacts.select(want, { multiple: false });
  if (!c) return null;
  return { name: (c.name && c.name[0]) || "", address: (c.address && c.address[0]) || null, phones: c.tel || [] };
}
function contactError(e) {
  if (e?.code === "DENIED") toast("Contacts are off for this app. Allow them in Calls, under Finish setting up.");
  else if (e && e.name !== "AbortError") toast("Couldn't open your contacts.");
}

/* ---- Place from a contact's address ---- */
async function pickContact() {
  try {
    const c = await readContact(["address"]);
    if (!c) return;
    const name = c.name, a = c.address;
    if (name && !$("#pname").value.trim()) $("#pname").value = name;
    if (ed.place.emoji === "📍") { ed.place.emoji = "🧑"; document.querySelectorAll("#emojis button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === "🧑")); }
    if (!a) { toast(`${name || "That contact"} has no address saved. Search for it or move the pin.`); return; }
    const lines = [...(a.addressLine || []), a.dependentLocality, a.city, a.region, a.postalCode, a.country].filter(Boolean);
    const full = lines.join(", ");
    $("#search").value = full;
    toast("Finding the address on the map…");
    const tries = [full, [a.city, a.region, a.country].filter(Boolean).length ? [...(a.addressLine || []).slice(0, 1), a.city, a.region, a.country].filter(Boolean).join(", ") : "", a.postalCode || ""].filter(Boolean);
    for (const q of tries) {
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=${encodeURIComponent(q)}`);
      const hit = (await res.json())[0];
      if (hit) {
        const lat = +hit.lat, lng = +hit.lon;
        if (ed.map) ed.map.setView([lat, lng], 18); else { ed.place.lat = lat; ed.place.lng = lng; }
        toast("Found it. Check the pin is on the right house.");
        return;
      }
    }
    toast("Couldn't find that address on the map. Try searching part of it, or move the pin.");
  } catch (e) { contactError(e); }
}

// Talks to CallerPlugin.java. The app doesn't bundle @capacitor/core, so this uses the

const Caller = (() => {
  const C = window.Capacitor;
  if (!C?.isNativePlatform?.() || !C.nativePromise) return null;
  const methods = ["pickContact", "sync", "testPopup", "status", "requestContacts", "requestNotifications",
    "requestScreening", "openOverlaySettings", "openPhonePermissions"];
  return Object.fromEntries(methods.map((m) => [m, (opts = {}) => C.nativePromise("RmtCaller", m, opts)]));
})();

  if (!Caller) return;

    .map((c) => ({

      reminders: c.reminders.map((r) => ({ text: r.text, items: (r.items || []).filter((i) => !i.done).map((i) => i.text) })),

  const json = JSON.stringify(entries);

function guideSteps() { return GUIDE.filter((g) => g.key !== "xiaomi" || callerStatus?.xiaomi); }

    if (!c) return;
    if (!c.phones.length) { toast(`${c.name || "That contact"} has no phone number saved.`); return; }
    const keys = c.phones.map(phoneKey);
    let person = state.calls.find((p) => (p.phones || []).some((n) => keys.includes(phoneKey(n))));
    if (person) {
      const merged = [...person.phones, ...c.phones.filter((n) => !person.phones.some((m) => phoneKey(m) === phoneKey(n)))];
      if (merged.length !== person.phones.length) await saveCall({ ...clean(person), phones: merged });
    } else {
      person = { id: uid(), name: c.name || c.phones[0], phones: c.phones, reminders: [], createdAt: Date.now() };
      await saveCall(person);
    }

  } catch (e) { contactError(e); }
}
// Same rule as the phone uses: compare the last 9 digits

async function alertAction(act, rid, i) {

function exportBackup() {
  const data = { app: "Remind Me There", version: 1, savedAt: new Date().toISOString(), places: state.places, calls: state.calls, history: state.history };
  const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
  const a = document.createElement("a"); a.href = url; a.download = `remind-me-there-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
}
async function importBackup(file) {
  try {
    const data = JSON.parse(await file.text());
    const places = Array.isArray(data.places) ? data.places.filter((p) => p && p.id && typeof p.lat === "number" && typeof p.lng === "number" && p.name) : [];
    const calls = Array.isArray(data.calls) ? data.calls.filter((c) => c && c.id && c.name && Array.isArray(c.phones)) : [];
    if (!places.length && !calls.length) { toast("That file doesn't have any places or call reminders in it."); return; }
    for (const p of places) await savePlace({ reminders: [], radius: 100, emoji: "📍", delay: 0, ...p });
    for (const c of calls) await saveCall({ reminders: [], ...c });
    toast(`Loaded ${[places.length ? plural(places.length, "place", "places") : "", calls.length ? plural(calls.length, "person", "people") : ""].filter(Boolean).join(" and ")}`);
  } catch { toast("Couldn't read that file. Choose a Remind Me There backup."); }
}

document.addEventListener("click", async (e) => {

      if (sheet?.type === "reminder") { syncDraftText(); openSheet({ type: "place", id: sheet.placeId }); }
      else if (sheet?.type === "callrem") { draft = null; openSheet({ type: "call", id: sheet.callId }); }
      else closeSheet();
    } break;
    case "addcall": addCallPerson(); break;
    case "opencall": openSheet({ type: "call", id }); break;
    case "newcallrem": openCallReminder(id); break;
    case "editcallrem": openCallReminder(sheet.id, id); break;
    case "backcall": draft = null; openSheet({ type: "call", id: sheet.callId }); break;
    case "savecallrem": saveCallDraft(); break;

    case "calldone": callReminderDone(sheet.id, id); break;
    case "delcall": { const c = state.calls.find((x) => x.id === id); if (c && confirm(`Remove ${c.name} and their call reminders?`)) { closeSheet(); await removeCall(id); toast("Removed"); } break; }
    case "caller-setup": startGuide(); break;
    case "guide-go": guideGo(); break;
    case "guide-skip": guide.skipped[guide.step] = true; guideShow(); break;
    case "guide-list": guide = null; rerenderSheet(); break;
    case "close": closeSheet(); break;
    case "track": startTracking(true); break;
    case "untrack": stopTracking(); break;
    case "add": unlockAudio(); openEditor(); break;
    case "open": openSheet({ type: "place", id }); break;
    case "edit": openEditor(id); break;
    case "newrem": openReminder(id); break;
    case "editrem": openReminder(sheet.id, id); break;
    case "backplace": syncDraftText(); draft = null; openSheet({ type: "place", id: sheet.placeId }); break;
    case "when": syncDraftText(); draft.when = el.dataset.v; rerenderSheet(); break;
    case "repeat": syncDraftText(); draft.repeat = el.dataset.v === "1"; rerenderSheet(); break;
    case "additem": addDraftItem(); break;
    case "rmitem": syncDraftText(); draft.items.splice(+el.dataset.i, 1); rerenderSheet(); break;
    case "saverem": saveDraft(); break;
    case "delrem": deleteDraft(); break;
    case "closeeditor": closeEditor(); break;
    case "contact": pickContact(); break;
    case "caller-contacts": case "caller-role": case "caller-overlay": case "caller-notif": case "caller-xiaomi": case "caller-test":
      callerAction(act); break;
    case "locate": locateMe(); break;
    case "emoji": ed.place.emoji = el.dataset.v; document.querySelectorAll("#emojis button").forEach((b) => b.setAttribute("aria-pressed", b === el)); break;
    case "delay": ed.place.delay = +el.dataset.v; el.parentElement.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b === el)); break;
    case "pick": {

  state.places = local.places; state.calls = local.calls; state.history = local.history; sortHistory();
  render();

  let authResolved = false;
  const finish = () => {
    if (authResolved) return; authResolved = true;
    hideSplash();
    if (!state.user && !load("rmt:onboarded", false)) showWelcome();
  };
  setTimeout(finish, 3500); // don't wait forever if the network is slow

  try {
    await loadFirebase();
    fb.getRedirectResult(fb.auth).catch((e) => { if (e?.code) console.warn(e.code); });
    fb.onAuthStateChanged(fb.auth, async (user) => {
      if (user) {
        state.user = { uid: user.uid, displayName: user.displayName, email: user.email };
        state.cloud = true;
        save("rmt:onboarded", true);
        hideWelcome();
        await moveGuestDataToAccount();
        startSync();
      } else {
        const wasSignedIn = state.cloud;
        state.user = null; state.cloud = false; stopSync();
        state.places = local.places; state.calls = local.calls; state.history = local.history; sortHistory();
        if (wasSignedIn) { save("rmt:onboarded", false); showWelcome(); }
      }
      render(); finish();
    });
  } catch (e) {
    console.warn("Firebase didn't load, using this phone only", e);
    finish();
  }

  if (state.prefs.tracking) startTracking(false);
}
boot();
</script>
</body>
</html>
